<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Dashboard</title>
    <!-- Import Chart.js for dynamic 3D-style graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
        }

        /* Glassmorphism Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .navbar a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
            transition: color 0.3s ease;
        }

        .navbar a:hover { color: #ffffff; }

        /* Responsive Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        /* 3D Hover Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .chart-container {
            grid-column: 1 / -1; /* Spans the full width of the grid */
        }
        /* Glassmorphism Form Inputs */
        .glass-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .glass-btn {
            width: 100%;
            padding: 12px;
            border: none;   
            border-radius: 8px;
            background: #00d2ff;
            color: #0f2027;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .glass-btn:hover {
            transform: translateY(-2px);
        }

        .delete-btn {
    background: rgba(255, 100, 100, 0.15);
    color: #ff6b6b;
    border: 1px solid rgba(255, 100, 100, 0.3);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

.delete-btn:hover {
    background: #ff6b6b;
    color: white;
    transform: scale(1.05);
}
    </style>
</head>
<body>

    <div class="navbar">
        <h2>ERP System Control</h2>
        <div>
            <a href="/">Dashboard</a>
            <a href="/suppliers">Suppliers</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="dashboard-grid">
        
        <!-- 1. Interactive Chart Card (Spans full width) -->
        <div class="glass-card chart-container">
            <h3>Inventory Flow Analytics</h3>
            <canvas id="inventoryChart" height="80"></canvas>
        </div>

        <!-- 2. Add New Item Form -->
        <div class="glass-card">
            <h3>Add New Inventory Item</h3>
            <form action="/add_item" method="POST">
                <input type="text" name="name" class="glass-input" placeholder="Product Name" required>
                <input type="number" name="stock" class="glass-input" placeholder="Initial Stock Quantity" required>
                <input type="number" step="0.01" name="price" class="glass-input" placeholder="Price" required>
                <button type="submit" class="glass-btn">+ Register Item</button>
            </form>
        </div>

        <!-- 3. Inventory Management Table -->
        <div class="glass-card">
            <h3>Inventory Management</h3>
            <table style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 15px;">
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                    <th style="padding: 10px; color: #00d2ff;">Item Name</th>
                    <th style="padding: 10px; color: #00d2ff;">Stock Level</th>
                    <th style="padding: 10px; color: #00d2ff;">Action</th>
                </tr>
                
                {% for i in range(labels|length) %}
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 10px;">{{ labels[i] }}</td>
                    <td style="padding: 10px;">{{ data[i] }}</td>
                    <td style="padding: 10px;">
                        <form action="/delete_item/{{ labels[i] }}" method="POST" style="margin: 0;">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>

    </div>

    <!-- Dynamic Chart Configuration -->
    <script>
        const ctx = document.getElementById('inventoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'line', /* You can also change this to 'bar' or 'doughnut' */
            data: {
                // 1. Inject the product names from Flask
                // Wrap the Jinja tags in single quotes so VS Code sees them as normal text strings
                labels: JSON.parse('{{ labels | tojson | safe }}'),
                datasets: [{
                    label: 'Current Stock',
                    data: JSON.parse('{{ data | tojson | safe }}'),
                    borderColor: '#00d2ff',
                    backgroundColor: 'rgba(0, 210, 255, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: 'white' } } },
                scales: {
                    x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        });
    </script>
</body>
</html>
