<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Dashboard</title>
    <!-- Import Chart.js for dynamic 3D-style graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
        }

        /* Glassmorphism Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .navbar a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
            transition: color 0.3s ease;
        }

        .navbar a:hover { color: #ffffff; }

        /* Responsive Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        /* 3D Hover Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .chart-container {
            grid-column: 1 / -1; /* Spans the full width of the grid */
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>ERP System Control</h2>
        <div>
            <a href="/">Dashboard</a>
            <a href="/suppliers">Suppliers</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="dashboard-grid">
        
        <!-- Interactive Chart Card -->
        <div class="glass-card chart-container">
            <h3>Inventory Flow Analytics</h3>
            <canvas id="inventoryChart" height="80"></canvas>
        </div>

        <!-- Data Table Card (Place your Jinja loops here) -->
        <div class="glass-card">
            <h3>Recent Activity</h3>
            <p style="color: rgba(255,255,255,0.7);">Your Jinja template table goes here...</p>
        </div>

        <!-- Add New Item Form -->
        <div class="glass-card">
            <h3>Add New Inventory Item</h3>
            <form action="/add_item" method="POST">
                <input type="text" name="name" placeholder="Product Name" required 
                    style="width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; box-sizing: border-box;">
        
                <input type="number" name="stock" placeholder="Initial Stock Quantity" required 
                    style="width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; outline: none; box-sizing: border-box;">
        
                <button type="submit" 
                    style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: #00d2ff; color: #0f2027; font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.2s ease;">
                  + Register Item
                </button>
            </form>
        </div>

    </div>

    <!-- Dynamic Chart Configuration -->
    <script>
        const ctx = document.getElementById('inventoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'line', /* You can also change this to 'bar' or 'doughnut' */
            data: {
                // 1. Inject the product names from Flask
                // Wrap the Jinja tags in single quotes so VS Code sees them as normal text strings
                labels: JSON.parse('{{ labels | tojson | safe }}'),
                datasets: [{
                    label: 'Current Stock',
                    data: JSON.parse('{{ data | tojson | safe }}'),
                    borderColor: '#00d2ff',
                    backgroundColor: 'rgba(0, 210, 255, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: 'white' } } },
                scales: {
                    x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        });
    </script>
</body>
</html>
